services:
  panel:
    build:
      context: .
      dockerfile: deploy/Dockerfile.panel
      args:
        VERSION: "${KGPANEL_VERSION:-dev}"
    container_name: kgpanel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KGPANEL_LISTEN: ":8080"
      KGPANEL_DATA: "/data"
      KGPANEL_SECRET: "${KGPANEL_SECRET:-change-me-in-.env}"
    volumes:
      - kgpanel-data:/data

  wings:
    build:
      context: .
      dockerfile: deploy/Dockerfile.wings
      args:
        VERSION: "${KGWINGS_VERSION:-dev}"
    container_name: kgwings
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      KGWINGS_LISTEN: ":8081"
      KGWINGS_TOKEN: "${KGWINGS_TOKEN:-change-me-in-.env}"
      KGWINGS_DATA: "/data"
      # host-visible path for docker -v mounts: must be the wings-data volume's
      # real path on the docker HOST (e.g. /mnt/user/apps/kgpanel/wings-data on
      # Unraid). Bare-metal wings can omit this (defaults to KGWINGS_DATA).
      KGWINGS_HOST_DATA: "${KGWINGS_HOST_DATA:-}"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wings-data:/data
    depends_on:
      - panel

volumes:
  kgpanel-data:
  wings-data:

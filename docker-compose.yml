services:
  panel:
    build:
      context: .
      dockerfile: deploy/Dockerfile.panel
    container_name: kgpanel
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KGPANEL_LISTEN: ":8080"
      KGPANEL_DATA: "/data"
      KGPANEL_SECRET: "${KGPANEL_SECRET:-change-me-in-.env}"
    volumes:
      - kgpanel-data:/data

  wings:
    build:
      context: .
      dockerfile: deploy/Dockerfile.wings
    container_name: kgwings
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      KGWINGS_LISTEN: ":8081"
      KGWINGS_TOKEN: "${KGWINGS_TOKEN:-change-me-in-.env}"
      KGWINGS_DATA: "/data"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - wings-data:/data
    depends_on:
      - panel

volumes:
  kgpanel-data:
  wings-data:

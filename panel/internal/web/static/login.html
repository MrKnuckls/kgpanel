<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KGPanel — sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/kg.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="logo"><img src="/img/knuckls-brass-K.png" alt="KGS"></div>
    <h1 id="authTitle">KGPanel</h1>
    <div class="sub" id="authSub">self-hosted game server control</div>

    <div id="err" class="err"></div>

    <!-- first-run setup wizard -->
    <div id="setupPnl" style="display:none">
      <div class="wizard-step">
        <div class="step-num">1</div>
        <div class="step-body">
          <h3>Create your administrator account</h3>
          <p class="muted" style="font-size:12px;margin-bottom:14px">This is the account you'll use to manage the panel and your nodes. You can add more admins later in the admin area.</p>
          <form id="setupForm">
            <div>
              <label for="suName">username</label>
              <input id="suName" autocomplete="username" required>
            </div>
            <div>
              <label for="suPass">password</label>
              <input id="suPass" type="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div>
              <label for="suPass2">confirm password</label>
              <input id="suPass2" type="password" autocomplete="new-password" required>
            </div>
            <button class="btn primary wide" type="submit">create admin &amp; continue</button>
          </form>
        </div>
      </div>
    </div>

    <!-- sign in -->
    <form id="loginForm" style="display:none">
      <div>
        <label for="username">username</label>
        <input id="username" autocomplete="username" required>
      </div>
      <div>
        <label for="password">password</label>
        <input id="password" type="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary wide" type="submit">sign in</button>
    </form>
  </div>
</div>
<script>
const API = "/api";
let state = localStorage.getItem("kg_token");

async function check() {
  if (!state) return;
  try {
    const r = await fetch(API + "/me", { headers: { Authorization: "Bearer " + state } });
    if (r.ok) { location.href = "/"; return; }
    localStorage.removeItem("kg_token"); state = null;
  } catch (e) {}
}
check();

function showErr(m) { document.getElementById("err").textContent = m; }

// decide: setup wizard or sign-in
(async function init() {
  try {
    const r = await fetch(API + "/setup/status");
    const d = await r.json();
    if (d.setup_required) {
      document.getElementById("authTitle").textContent = "Welcome";
      document.getElementById("authSub").textContent = "first run — let's set up KGPanel";
      document.getElementById("setupPnl").style.display = "block";
    } else {
      document.getElementById("loginForm").style.display = "flex";
    }
  } catch (e) {
    document.getElementById("loginForm").style.display = "flex";
  }
})();

// first-run setup: POST /api/setup creates the admin, then auto-logs-in
document.getElementById("setupForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  showErr("");
  const name = document.getElementById("suName").value.trim();
  const pass = document.getElementById("suPass").value;
  const pass2 = document.getElementById("suPass2").value;
  if (pass !== pass2) { showErr("passwords don't match"); return; }
  if (pass.length < 8) { showErr("password must be at least 8 characters"); return; }
  try {
    const r = await fetch(API + "/setup", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username: name, password: pass }),
    });
    const d = await r.json();
    if (d.token) { localStorage.setItem("kg_token", d.token); location.href = "/"; }
    else showErr(d.error || "setup failed");
  } catch (e) { showErr("setup failed — is the panel running?"); }
});

// sign in
document.getElementById("loginForm").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  showErr("");
  const username = document.getElementById("username").value.trim();
  const password = document.getElementById("password").value;
  try {
    const r = await fetch(API + "/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    const d = await r.json();
    if (d.token) { localStorage.setItem("kg_token", d.token); location.href = "/"; }
    else showErr(d.error || "invalid credentials");
  } catch (e) { showErr("login failed — is the panel running?"); }
});
</script>
</body>
</html>
